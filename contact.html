  <main>
   <section class="section container contact-section">
  <h1>Get in touch</h1>
  <p class="intro">Email or WhatsApp us to start your custom order.</p>

  <!-- Success message (hidden by default) -->
  <div id="success-message" class="success-message" style="display: none;">
    <p>Thank you! Your message has been sent. We’ll get back to you within 24 hours.</p>
  </div>

  <form id="contact-form" class="contact-form" action="https://formspree.io/f/xnnoylpn" method="POST">
    <label>
      <span>Full Name</span>
      <input type="text" name="name" required>
    </label>
    <label>
      <span>Email</span>
      <input type="email" name="email" required>
    </label>
    <label>
      <span>Message</span>
      <textarea name="message" rows="5" required></textarea>
    </label>
    <button class="btn" type="submit">Send message</button>
  </form>
</section>

    <div class="bottom-image">
    <img src="images/bottomimg2.jpg" alt="Custom Wear" />
