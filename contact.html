<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Custom Wear — Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-contact">

  <header class="header transparent">
    <div class="header-inner container">
      <div class="left"><a class="logo" href="index.html"><img src="images/logo.png" alt="Custom Wear logo"></a></div>
      <div class="center"><div class="site-title">Custom Wear</div></div>
      <div class="right">
        <button class="hamburger" id="hamburger-contact" aria-label="Open menu">☰</button>
        <nav class="nav desktop-nav" id="navMenuContact">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
          <a class="cta" href="https://wa.me/27737553136?text=Hi%20I'd%20like%20to%20place%20a%20custom%20Tshirt%20order" target="_blank" rel="noopener">WhatsApp</a>
        </nav>
      </div>
    </div>
  </header>

  <nav class="mobile-drawer" id="mobileDrawerContact" aria-hidden="true">
    <button class="drawer-close" id="drawerCloseContact" aria-label="Close menu">✕</button>
    <ul class="drawer-list">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a class="cta" href="https://wa.me/27737553136?text=Hi%20I'd%20like%20to%20place%20a%20custom%20Tshirt%20order" target="_blank" rel="noopener">WhatsApp</a></li>
    </ul>
  </nav>

  <main>
   <section class="section container contact-section">
  <h1>Get in touch</h1>
  <p class="intro">Email or WhatsApp us to start your custom order.</p>

  <!-- Success message (hidden by default) -->
  <div id="success-message" class="success-message" style="display: none;">
    <p>Thank you! Your message has been sent. We’ll get back to you within 24 hours.</p>
  </div>

  <form id="contact-form" class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <label>
      <span>Full Name</span>
      <input type="text" name="name" required>
    </label>
    <label>
      <span>Email</span>
      <input type="email" name="email" required>
    </label>
    <label>
      <span>Message</span>
      <textarea name="message" rows="5" required></textarea>
    </label>
    <button class="btn" type="submit">Send message</button>
  </form>
</section>

    <div class="bottom-image">
    <img src="bottomimg.jpg" alt="Custom Wear" />
  </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div>© Custom Wear — Tailored by Imagination</div>
      <div class="footer-links"><a href="https://www.instagram.com/custom.wear_?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener">Instagram</a></div>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
